services:
  db:
    image: postgres:16-alpine
    container_name: lifeline-db
    environment:
      POSTGRES_USER: lifeline
      POSTGRES_PASSWORD: lifeline
      POSTGRES_DB: lifeline
    ports:
      # 5433 on the host to avoid clashing with a locally installed Postgres
      - "5433:5432"
    volumes:
      - lifeline-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeline"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lifeline-pgdata:
